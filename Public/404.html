<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 // VOID SECTOR - Aphrodite</title>
		<meta name="robots" content="noindex" />
		<style>
			:root {
				--soot-black: #09090b;
				--carbon-void: #111014;
				--oxblood-dark: #520612;
				--blood-crimson: #7a0a1e;
				--raw-blood: #931128;
				--bone-newsprint: #dedbd2;
				--bone-white: #ece9e0;
				--zinc-dust: #73717b;
				--stamped-canary: #e5a93b;
				--weathered-teal: #208079;
				--font-headline: "Space Grotesk", system-ui, sans-serif;
				--font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--soot-black);
				color: var(--bone-newsprint);
				font-family: var(--font-mono);
				-webkit-font-smoothing: antialiased;
			}

			main {
				max-width: 560px;
				margin: 1rem;
				padding: 2rem;
				background: var(--carbon-void);
				border: 4px solid var(--blood-crimson);
				box-shadow:
					6px 6px 0px #000000,
					10px 10px 0px var(--oxblood-dark);
				transform: rotate(-1.5deg);
				position: relative;
			}

			.tape {
				position: absolute;
				top: -14px;
				left: 24px;
				background: var(--raw-blood);
				color: var(--bone-white);
				padding: 2px 12px;
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				border: 1px solid #000;
				box-shadow: 2px 2px 0px #000;
			}

			.code {
				margin: 0 0 0.5rem;
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--raw-blood);
			}

			h1 {
				margin: 0 0 0.75rem;
				font-family: var(--font-headline);
				font-size: 34px;
				font-weight: 800;
				text-transform: uppercase;
				letter-spacing: -0.03em;
				color: var(--bone-white);
				text-shadow: 4px 4px 0px var(--oxblood-dark);
			}

			p {
				margin: 0 0 1.25rem;
				font-size: 12px;
				line-height: 1.7;
				color: var(--zinc-dust);
			}

			.hash {
				margin: 0 0 1.5rem;
				font-size: 11px;
				font-weight: 700;
				color: var(--weathered-teal);
				word-break: break-all;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
			}

			a {
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--bone-white);
				background: var(--raw-blood);
				border: 1px solid #000;
				box-shadow: 3px 3px 0px #000;
				padding: 6px 14px;
				text-decoration: none;
			}

			a:hover {
				background: var(--blood-crimson);
			}
		</style>
	</head>
	<body>
		<main>
			<div class="tape">404 // VOID SECTOR</div>
			<p class="code">STATUS: 404</p>
			<h1>Data not in spool</h1>
			<p>
				The requested path is not part of the Aphrodite site. Nothing was compressed,
				cached, or stored at this address - the CCR registry holds no entry for it.
			</p>
			<p class="hash">&lt;&lt;&lt;CCR:0x0000000000000000|not_found|0&gt;&gt;&gt;</p>
			<nav>
				<a href="/">Overview</a>
				<a href="/setup/">Setup</a>
				<a href="/crates/">Crates</a>
				<a href="/versions/">Versions</a>
				<a href="/benchmarks/">Benchmarks</a>
			</nav>
		</main>
	</body>
</html>
