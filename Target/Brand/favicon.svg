<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    favicon.svg - the zine grammar: the aphrodite mark on the blood-crimson
    field, the distressed stencil offset shadow, the risograph stipple, the
    canary/teal specks. Adapted from Reference/Stitch/code.html (brand card).
  -->
  <defs>
    <pattern id="stipple" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#520612"/>
      <circle cx="2.5" cy="2.5" r="0.4" fill="#3d040d"/>
    </pattern>
  </defs>
  <!-- Blood-crimson field -->
  <rect width="64" height="64" fill="#7a0a1e"/>
  <!-- Distressed stencil offset shadow -->
  <g transform="translate(10,22) scale(0.25)">
    <path d="M 8,62 C 30,32 66,16 100,40 C 134,16 170,32 192,62 C 158,54 126,56 100,66 C 74,56 42,54 8,62 Z" fill="#3d040d"/>
    <path d="M 18,64 C 46,100 80,114 100,114 C 120,114 154,100 182,64 C 146,90 118,74 100,74 C 82,74 54,90 18,64 Z" fill="#3d040d"/>
  </g>
  <!-- The aphrodite mark, carbon-void fill -->
  <g transform="translate(7,19) scale(0.25)">
    <path d="M 8,62 C 30,32 66,16 100,40 C 134,16 170,32 192,62 C 158,54 126,56 100,66 C 74,56 42,54 8,62 Z" fill="#09090b"/>
    <path d="M 18,64 C 46,100 80,114 100,114 C 120,114 154,100 182,64 C 146,90 118,74 100,74 C 82,74 54,90 18,64 Z" fill="#09090b"/>
    <!-- Risograph stipple over the upper lip -->
    <path d="M 8,62 C 30,32 66,16 100,40 C 134,16 170,32 192,62 C 158,54 126,56 100,66 C 74,56 42,54 8,62 Z" fill="url(#stipple)"/>
    <!-- Raw screenprint highlight / tooth gap -->
    <path d="M 42,63 C 72,69 100,71 158,63 C 128,66 72,66 42,63 Z" fill="#ece9e0" opacity="0.9"/>
  </g>
  <!-- Screen ink splatters / halftone specks -->
  <circle cx="13" cy="14" fill="#20807b" r="2.6"/>
  <circle cx="24" cy="10" fill="#e5a93b" r="1.8"/>
  <circle cx="52" cy="14" fill="#e5a93b" r="2.2"/>
  <circle cx="58" cy="24" fill="#20807b" r="1.8"/>
  <circle cx="54" cy="50" fill="#dedbd2" opacity="0.6" r="1.4"/>
  <circle cx="14" cy="52" fill="#dedbd2" opacity="0.6" r="1.4"/>
</svg>
